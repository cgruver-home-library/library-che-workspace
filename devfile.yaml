schemaVersion: 2.3.0
attributes:
  controller.devfile.io/storage-type: per-workspace
metadata:
  name: home-library
projects:
- name: workspace-config
  git:
    checkoutFrom:
      remote: origin
      revision: main
    remotes:
      origin: https://github.com/cgruver-home-library/library-che-workspace.git
- name: catalog
  git:
    checkoutFrom:
      remote: origin
      revision: main
    remotes:
      origin: https://github.com/cgruver-home-library/catalog.git
- name: librarian
  git:
    checkoutFrom:
      remote: origin
      revision: main
    remotes:
      origin: https://github.com/cgruver-home-library/librarian.git
- name: bookshelf
  git:
    checkoutFrom:
      remote: origin
      revision: main
    remotes:
      origin: https://github.com/cgruver-home-library/bookshelf.git
- name: pipelines
  git:
    checkoutFrom:
      remote: origin
      revision: main
    remotes:
      origin: https://github.com/cgruver-home-library/tekton-pipelines.git
components:
- name: dev-tools
  container: 
    image: quay.io/cgruver0/che/quarkus-angular-node20-java21:latest
    memoryRequest: 1Gi
    memoryLimit: 6Gi
    cpuRequest: 100m
    cpuLimit: 2000m
    mountSources: true
    endpoints:
      - name: http-quarkus
        targetPort: 8080
      - exposure: none
        name: debug
        targetPort: 5858
    env:
      - name: DEBUG_PORT
        value: '5858'
      - name: HOME
        value: "/projects/home"
      - name: VSCODE_DEFAULT_WORKSPACE
        value: "/projects/workspace-config/home-library.code-workspace"
- name: projects
  volume:
    size: 25Gi
- name: prep-workspace
  container:
    args:
      - '-c'
      - >-
        mkdir -p /projects/bin && cp /usr/bin/oc /projects/bin/oc && cp /usr/bin/kubectl /projects/bin/kubectl && if [[ -f ${HOME}/.kube/config ]]; then rm ${HOME}/.kube/config; fi
    command:
      - /bin/bash
    image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
    mountSources: true
    sourceMapping: /projects
    memoryRequest: 128Mi
    memoryLimit: 256Mi
    cpuRequest: 10m
    cpuLimit: 200m
    env:
    - name: HOME
      value: "/projects/home"
commands:
- apply:
    component: prep-workspace
    label: Pre Start Prep
  id: prep-workspace
events:
  preStart:
    - prep-workspace